<html lang="pt-PT"><head><meta charset="utf-8">

<title>Inovação 26/27 · Membros</title>
<style>
:root{--bg:#f3f6fa;--surface:#fff;--surface-2:#f7f9fc;--fg:#122033;--muted:#5a6a80;--line:#dbe3ee;--line-2:#c3cfdf;--brand:#175dab;--brand-soft:#e6f0fb;--on-brand:#fff;--ok:#1a7f4b;--ok-soft:#e1f3e9;--warn:#946200;--warn-soft:#fbf0d4;--bad:#b4231b;--bad-soft:#fbe7e5;--r:10px;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Montserrat",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d1420;--surface:#141d2b;--surface-2:#192435;--fg:#e3eaf4;--muted:#93a3b8;--line:#253246;--line-2:#34445c;--brand:#5aa2f0;--brand-soft:#1a2c45;--on-brand:#0b1422;--ok:#5fd394;--ok-soft:#14301f;--warn:#e8b84e;--warn-soft:#352a10;--bad:#ff8a7e;--bad-soft:#3b1a18}}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25}h1{font-size:1.35rem}h2{font-size:1.1rem}h3{font-size:1rem}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .sp{flex:1;min-width:0}.bar small{color:var(--muted);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.login{max-width:380px;margin:12vh auto 0}.login .card{padding:24px}
label{display:block;font-weight:700;font-size:.85rem;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;cursor:pointer;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:700}
button.pri{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}button.lnk{border:0;background:none;color:var(--brand);padding:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:0 0 14px}.tabs button{flex:1}.tabs button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.stars{color:var(--line-2);letter-spacing:2px;white-space:nowrap}.stars .on{color:#e0a100}
.pp{display:inline-flex;margin-left:4px}.pp img,.pp i{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;object-fit:cover;background:var(--brand-soft);color:var(--brand);font:700 .62rem/22px var(--body);text-align:center;font-style:normal;display:inline-block}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.85rem;margin:4px 0 10px}
.txt{white-space:pre-wrap;margin:0 0 10px}.lab{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 2px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}summary{cursor:pointer;font-weight:700;min-height:36px;display:flex;align-items:center}
.fb{padding:8px 0;border-top:1px dashed var(--line)}.fb:first-of-type{border-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;background:var(--brand-soft)}.msg.err{background:var(--bad-soft);color:var(--bad)}
.note{color:var(--muted);font-size:.88rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chips button{min-height:36px;padding:4px 12px;border-radius:99px;font-weight:600}.chips button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}.sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}.sum b{display:block;font:800 1.35rem/1.1 var(--display)}.sum span{font-size:.78rem;color:var(--muted)}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ch h3{font-size:1.08rem}.sb{flex:none}
.ps2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ps2>div{background:var(--surface-2);border-radius:8px;padding:8px 12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:620px){.ps2{grid-template-columns:1fr}.sum{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:520px){.tabs{flex-direction:column}}
.adm{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;background:var(--warn-soft);color:var(--fg);border-bottom:1px solid var(--line)}
.adm b{color:var(--warn)}.adm select{width:auto;min-height:36px;padding:4px 8px}.adm label{display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:600;font-size:.88rem}.adm input[type=checkbox]{width:auto;min-height:0}
.adm button{min-height:36px;padding:4px 12px}
.res{display:block;width:100%;text-align:left;font-weight:400;background:var(--brand-soft);border:1px solid transparent;border-radius:8px;padding:10px 12px;margin:10px 0 0;color:var(--fg)}
.res:hover{border-color:var(--brand)}.res .lab{display:block;margin:0 0 4px;color:var(--brand)}.res .more{display:block;margin-top:6px;font-weight:700;color:var(--brand);font-size:.88rem}
.fbl{border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-top:6px}
.pan{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 14px 14px;margin-top:10px}
.pan h4{margin:10px 0 0;font-family:var(--display);font-size:.95rem}
.reqs{display:flex;flex-direction:column;gap:4px;margin-top:10px}.reqs div{font-size:.88rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 8px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:4px 0}.chk input{width:auto;min-height:0}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}.pick button{display:flex;gap:8px;align-items:center;text-align:left;font-weight:600}
.pick .pp img,.pick .pp i{margin-left:0}
.ps2.c{margin-top:6px}
</style></head><body>
<div id="app"></div>
<script>
const U="https://hggrgaktnacmmgmaoeib.supabase.co",K="sb_publishable_em1gUMD7EQjI8n1hCE18tQ_DSy-eAsR",DOM="@junitec.pt",LS_CODE="inov-coord-code",SS_ADM="inov-membro-admin";
const st={ses:null,nome:"",ideias:[],fb:[],fotos:{},sug:[],mat:[],tab:"",c1f:"todas",msg:null,load:false,view:"",sim:true,membros:[],openFb:new Set(),pan:"",q:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lc=s=>String(s||"").toLowerCase();
const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const lsGet=()=>{try{return JSON.parse(localStorage.getItem("inov-membro")||"null")}catch(e){return null}};
const lsSet=v=>{try{v?localStorage.setItem("inov-membro",JSON.stringify(v)):localStorage.removeItem("inov-membro")}catch(e){}};
const codeGet=()=>{try{return localStorage.getItem(LS_CODE)||""}catch(e){return ""}};
const codeSet=v=>{try{v?localStorage.setItem(LS_CODE,v):localStorage.removeItem(LS_CODE)}catch(e){}};
const admGet=()=>{try{return JSON.parse(sessionStorage.getItem(SS_ADM)||"null")}catch(e){return null}};
const admSet=v=>{try{v?sessionStorage.setItem(SS_ADM,JSON.stringify(v)):sessionStorage.removeItem(SS_ADM)}catch(e){}};
const isAdm=()=>!!(st.ses&&st.ses.admin);
const myEmail=()=>st.ses?st.ses.user.email:"";
/* No modo admin (coordenador a ver como um membro) os pedidos vão com o código de coordenador, não com a sessão do membro. */
const hdr=(x)=>{const h={apikey:K,Authorization:"Bearer "+(st.ses&&!st.ses.admin?st.ses.access_token:K)};if(isAdm()||st.view==="admin")h["x-inov-code"]=st.code||codeGet();return Object.assign(h,x||{});};
async function auth(path,body,method){const r=await fetch(U+"/auth/v1/"+path,{method:method||"POST",headers:hdr({"Content-Type":"application/json"}),body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Erro");return j;}
function setSes(j){st.ses={access_token:j.access_token,refresh_token:j.refresh_token,user:j.user,exp:Date.now()+(j.expires_in||3600)*1000-60000};lsSet({r:j.refresh_token});}
async function fresh(){if(st.ses&&!st.ses.admin&&Date.now()>st.ses.exp){const j=await auth("token?grant_type=refresh_token",{refresh_token:st.ses.refresh_token});setSes(j);}}
async function rest(path,opt){await fresh();const r=await fetch(U+"/rest/v1/"+path,Object.assign({headers:hdr({"Content-Type":"application/json"})},opt||{}));if(!r.ok)throw new Error((await r.text()).slice(0,200));const t=await r.text();return t?JSON.parse(t):null;}
const docs=c=>rest("docs?select=id,data&col=eq."+c+"&limit=2000").then(a=>a.map(x=>x.data));
const ideia=id=>st.ideias.find(x=>x.id===id);
const isMine=i=>!!i&&(i.par||[]).includes(st.nome);
const ETAPA={c1:1,c2:2,sd:3,startup:4};
const isC1=i=>(ETAPA[i.etapa]||0)>=1;
const isC2=i=>(ETAPA[i.etapa]||0)>=2;
async function loadAll(){st.load=true;render();
  const [i,f,fo,su,ma,nm]=await Promise.all([docs("ideias"),docs("feedback"),docs("fotos"),docs("sugestoes"),docs("materiais"),isAdm()?Promise.resolve(st.nome):rest("rpc/inov_nome",{method:"POST",body:"{}"})]);
  st.ideias=i;st.fb=f;st.fotos=(fo.find(x=>x.fotos)||{}).fotos||{};st.nome=nm||(st.ses.user.user_metadata||{}).nome||"";
  /* Mesmo filtro que o Supabase aplica a um membro: só os seus pedidos e os ficheiros das suas ideias (no modo admin o coordenador recebe tudo). */
  const em=lc(myEmail());st.sug=su.filter(s=>lc(s.email)===em);st.mat=ma.filter(m=>lc(m.email)===em||isMine(ideia(m.ideiaId)));st.load=false;}
function ordem(a,b){return (b.gosto||0)-(a.gosto||0)||(b.sessao||0)-(a.sessao||0)||String(b.createdAt||"").localeCompare(String(a.createdAt||""));}
const VER={matar:["Difícil","bad"],gosto:["Gosto","ok"],mercado:["Validar mercado","warn"],outro:["Outro","warn"]};
const TIPO={descricao:"Alteração da descrição",participar:"Pedido para participar",colaborar:"Pedido para colaborar",matar:"Pedido para matar a ideia",repescagem:"Pedido para passar ao Challenge I"};
const estPill=s=>{const e=s.estado||"pendente";return `<span class="pill ${e==="aceite"?"ok":e==="rejeitada"?"bad":"warn"}">${esc(e)}</span>`;};
function av(n){const f=st.fotos[n],ini=String(n||"?").split(" ").map(x=>x[0]||"").join("").slice(0,2);return f?`<img src="${esc(f)}" alt="${esc(n)}" title="${esc(n)}" loading="lazy" onerror="this.outerHTML='<i title=&quot;${esc(n)}&quot;>${esc(ini)}</i>'">`:`<i title="${esc(n)}">${esc(ini)}</i>`;}
function stars(g){return `<span class="stars" role="img" aria-label="${g||0} de 5 estrelas">${[1,2,3,4,5].map(k=>`<span class="${k<=(g||0)?"on":""}">★</span>`).join("")}</span>`;}
function fbOc(f){if(f.ocultoMembros!==undefined)return !!f.ocultoMembros;const raw=String(f.comentario||"").trim();if(!raw)return false;const x=raw.replace(/^\[Sessão \d\]\s*/,"").trim();if(!x)return true;return x.length<=12||(!/\s/.test(x)&&x.length<=15);}
const fbVis=i=>st.fb.filter(f=>f.ideiaId===i.id&&f.tipo!=="c1aval"&&!fbOc(f)).sort((a,b)=>String(b.d||"").localeCompare(String(a.d||"")));
function fbHtml(i){const l=fbVis(i);
  if(!l.length)return `<p class="note">Ainda sem feedback individual visível.</p>`;
  return l.map(f=>{const v=VER[f.veredito]||[f.veredito||"",""];return `<div class="fb"><b>${esc(f.jurado||"Júri")}</b> ${v[0]?`<span class="pill ${v[1]}">${esc(v[0])}${f.custom?": "+esc(f.custom):""}</span>`:""} <span class="note">${esc(f.d||"")}</span>${f.comentario?`<p class="txt" style="margin:4px 0 0">${esc(f.comentario)}</p>`:""}</div>`;}).join("");}
/* Resumo do feedback: o resumo curto do júri (resumoJuri); se não houver, o último resumo por sessão. Clicar mostra todos os feedbacks visíveis. */
function resTxt(i){if(i.resumoJuri&&!(i.resumoS&&i.resumoS.c1))return esc(i.resumoJuri).replace(/\s*\[Fundida: «([^»]+)»\]\s*/g,(m,t)=>`<br><span class="note">Da ideia juntada «${t}»:</span> `);
  const R=i.resumoS||{},k=Object.keys(R).filter(x=>R[x]).sort((x,y)=>(({c1:100,c2:101,sd:102})[x]||Number(x)||0)-(({c1:100,c2:101,sd:102})[y]||Number(y)||0));return k.length?esc(R[k[k.length-1]]).replace(/\n/g,"<br>"):"";}
/* Separadores Challenge: no Challenge II só o resumo do Challenge I; no Challenge I primeiro o resumo do Challenge I e depois o das sessões de ideação (com os feedbacks das sessões). */
function sesTxt(i){const R=i.resumoS||{},k=Object.keys(R).filter(x=>R[x]&&/^\d+$/.test(x)).sort((a,b)=>a-b),t=i.resumoJuri||(k.length?R[k[k.length-1]]:"");
  return t?esc(t).replace(/\s*\[Fundida: «([^»]+)»\]\s*/g,(m,x)=>`<br><span class="note">Da ideia juntada «${x}»:</span> `).replace(/\n/g,"<br>"):"";}
function phRes(i,ph){const r=i.resumoS&&i.resumoS.c1?esc(i.resumoS.c1).replace(/\n/g,"<br>"):"";
  const c1b=`<div class="res" style="cursor:default"><span class="lab">Resumo do feedback do júri · Challenge I</span>${r||'<span class="note">Ainda sem resumo do Challenge I.</span>'}</div>`;
  if(ph==="c2")return c1b;
  const n=fbVis(i).length,o=st.openFb.has(i.id),t=sesTxt(i);
  return c1b+`<button type="button" class="res" data-a="fbt" data-id="${esc(i.id)}" aria-expanded="${o}"><span class="lab">Resumo do feedback das sessões de ideação</span>${t||'<span class="note">Ainda sem resumo.</span>'}${n?`<span class="more">${o?"Esconder os feedbacks ▴":`Ver os feedbacks das sessões (${n}) ▾`}</span>`:""}</button>${o?`<div class="fbl">${fbHtml(i)}</div>`:""}`;}
function resBlock(i){const n=fbVis(i).length,o=st.openFb.has(i.id),t=resTxt(i);
  return `<button type="button" class="res" data-a="fbt" data-id="${esc(i.id)}" aria-expanded="${o}"><span class="lab">Resumo do feedback do júri</span>${t||'<span class="note">Ainda sem resumo.</span>'}<span class="more">${o?"Esconder os feedbacks ▴":`Ver todos os feedbacks (${n}) ▾`}</span></button>${o?`<div class="fbl">${fbHtml(i)}</div>`:""}`;}
function psHtml(i,open){return `<details${open?" open":""}><summary>Problema e solução</summary><div class="ps2 c"><div><div class="lab" style="margin-top:4px">Problema</div><p class="txt">${esc(i.problema||"—")}</p></div><div><div class="lab" style="margin-top:4px">Solução</div><p class="txt">${esc(i.solucao||"—")}</p></div></div></details>`;}
function metaHtml(i){const ma=st.mat.filter(m=>m.ideiaId===i.id);return `<div class="meta">${stars(i.gosto)} <span class="pp">${(i.par||[]).filter(Boolean).map(av).join("")}</span> <span>${esc((i.par||[]).filter(Boolean).join(", "))}</span>${i.criadaPor?' <span class="pill">ideia nova</span>':""}${ma.length?` <span class="pill" title="Ficheiros">${ma.length} ficheiro${ma.length>1?"s":""}</span>`:""}</div>`;}
function reqsHtml(i){const l=st.sug.filter(s=>s.ideiaId===i.id).sort((a,b)=>String(b.em).localeCompare(String(a.em)));
  return l.length?`<div class="reqs">${l.map(s=>`<div>${estPill(s)} ${esc(TIPO[s.tipo]||s.tipo)} <span class="note">· ${(s.em||"").slice(0,10)}${s.teste?" · teste":""}</span></div>`).join("")}</div>`:"";}
const pend=(i,t)=>st.sug.some(s=>s.ideiaId===i.id&&s.tipo===t&&(s.estado||"pendente")==="pendente");
function fileList(ma){return ma.length?ma.map(m=>`<div class="fb">${m.url?`<a class="lnk" href="${esc(/^https?:\/\//i.test(m.url)?m.url:"https://"+m.url)}" target="_blank" rel="noopener" style="padding:8px;font-weight:700">${esc(m.ficheiro||m.url)} ↗</a>`:`<button class="lnk" data-a="dl" data-p="${esc(m.path)}">${esc(m.ficheiro)}</button>`} <span class="pill">${esc(m.tipo)}</span> <span class="note">${esc(m.nome)} · ${(m.em||"").slice(0,10)}</span>${lc(m.email)===lc(myEmail())?` <button class="lnk" data-a="rm" data-id="${esc(m.id)}" data-p="${esc(m.path)}">Remover</button>`:""}</div>`).join(""):`<p class="note">Ainda sem ficheiros.</p>`;}
/* Escolher ficheiros já enviados + juntar novos (usado em "matar" e no pedido para passar ao Challenge I). */
function filePick(i,pre,req){const ma=st.mat.filter(m=>m.ideiaId===i.id);
  return `<div class="lab">${req?"Ficheiros de validação (obrigatório, pelo menos 1)":"Ficheiros de apoio (opcional)"}</div>${ma.map(m=>`<label class="chk"><input type="checkbox" class="${pre}-old" value="${esc(m.id)}"> ${esc(m.ficheiro)} <span class="note">· ${esc(m.tipo)}</span></label>`).join("")}
  <label for="${pre}-f-${esc(i.id)}">${ma.length?"Ou junta novos":"Juntar ficheiros"} (PDF, Word, Excel, PowerPoint, imagem… até 25 MB cada)</label><input type="file" multiple id="${pre}-f-${esc(i.id)}" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.png,.jpg,.jpeg">`;}
function matHtml(i){const ma=st.mat.filter(m=>m.ideiaId===i.id);return fileList(ma)+
  `<p class="note" style="margin:10px 0 0">O júri vê estes ficheiros no Challenge. Os <b>slides do pitch em PDF</b> abrem num leitor página a página.</p>
  <label for="t-${esc(i.id)}">Tipo</label><select id="t-${esc(i.id)}"><option>Slides do pitch</option><option>Validação de mercado</option><option>Pesquisa</option><option>Outro</option></select>
  <label for="f-${esc(i.id)}">Ficheiro (slides em PDF, Word, Excel, imagem… até 25 MB)</label><input type="file" id="f-${esc(i.id)}" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.png,.jpg,.jpeg"><div class="row"><button class="pri" data-a="up" data-id="${esc(i.id)}">Enviar ficheiro</button></div>
  <div class="lab" style="margin-top:14px">Ou junta um link</div><label for="lu-${esc(i.id)}">Link (MVP, protótipo, Figma, Google Slides…)</label><input id="lu-${esc(i.id)}" type="url" inputmode="url" placeholder="https://…">
  <label for="ln-${esc(i.id)}">Nome do link</label><input id="ln-${esc(i.id)}" maxlength="80" placeholder="Ex.: MVP no Figma">
  <label for="lt-${esc(i.id)}">Tipo</label><select id="lt-${esc(i.id)}"><option>MVP / protótipo</option><option>Slides do pitch</option><option>Validação de mercado</option><option>Outro</option></select><div class="row"><button data-a="link" data-id="${esc(i.id)}">Juntar link</button></div>`;}
function altHtml(i,withTitle){return `<label for="at-${esc(i.id)}">Título</label><input id="at-${esc(i.id)}" maxlength="120" value="${esc(i.titulo||"")}"${withTitle?"":" disabled"}>
  <label for="p-${esc(i.id)}">Problema (ideia)</label><textarea id="p-${esc(i.id)}">${esc(i.problema||"")}</textarea>
  <label for="s-${esc(i.id)}">Solução</label><textarea id="s-${esc(i.id)}">${esc(i.solucao||"")}</textarea>
  <label for="n-${esc(i.id)}">Porquê? (opcional)</label><input id="n-${esc(i.id)}"><div class="row"><button class="pri" data-a="sug" data-id="${esc(i.id)}">Enviar proposta ao coordenador</button></div><p class="note">O título e a descrição só mudam depois de o coordenador aceitar.</p>`;}
const panBtn=(i,k,label,pri)=>{const on=st.pan===i.id+"|"+k;return `<button${pri?' class="pri"':""} data-a="pan" data-id="${esc(i.id)}" data-k="${k}" aria-expanded="${on}">${label}</button>`;};
const panOn=(i,k)=>st.pan===i.id+"|"+k;
function c1Card(i,ph){ph=ph||"c1";const mine=isMine(i),FN=ph==="c2"?"Challenge II":"Challenge I";

const SIMN=" (simulação: nada foi gravado)";
async function upload(id,f,tipo){if(f.size>26214400)throw new Error("«"+f.name+"» tem mais de 25 MB.");
  const safe=f.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_");
  const mid=nid("m"),d={id:mid,email:myEmail(),nome:st.nome,ideiaId:id,ficheiro:f.name,path:"",tipo,tamanho:f.size,em:new Date().toISOString()};
  /* No modo admin os ficheiros não sobem ao Storage: ficam simulados no ecrã. */
  if(isAdm()){d.path="simulado/"+mid;d.simulado=true;d.teste=true;st.mat.push(d);return d;}
  await fresh();const path=id+"/"+Date.now().toString(36)+"-"+safe;
  const r=await fetch(U+"/storage/v1/object/materiais/"+path,{method:"POST",headers:hdr({"Content-Type":f.type||"application/octet-stream","x-upsert":"false"}),body:f});if(!r.ok)throw new Error("Não foi possível enviar «"+f.name+"».");
  d.path=path;await rest("docs",{method:"POST",body:JSON.stringify({col:"materiais",id:mid,data:d})});st.mat.push(d);return d;}
async function filesFrom(pre,id,tipo){const old=[...document.querySelectorAll("."+pre+"-old:checked")].map(c=>st.mat.find(m=>m.id===c.value)).filter(Boolean);
  const inp=document.getElementById(pre+"-f-"+id),nw=[];for(const f of (inp&&inp.files?[...inp.files]:[]))nw.push(await upload(id,f,tipo));
  return [...old,...nw].map(m=>({id:m.id,path:m.path,ficheiro:m.ficheiro,tipo:m.tipo,simulado:!!m.simulado}));}

  else if(a==="fbt"){st.openFb.has(id)?st.openFb.delete(id):st.openFb.add(id);render();keep();}
  else if(a==="pan"){const k=id+"|"+b.dataset.k;st.pan=st.pan===k?"":k;render();keep();const art=document.getElementById("i-"+id),p=art&&art.querySelector(".pan");if(p){p.scrollIntoView({behavior:"smooth",block:"nearest"});const f=p.querySelector("textarea,input:not([disabled]),select");if(f)f.focus({preventScroll:true});}}
  else if(a==="adm"){st.msg=null;const c=codeGet();if(c&&await admEnter(c)){render();}else{st.view="admcode";render();}}
  else if(a==="admback"){st.view="";st.msg=null;render();}
  else if(a==="admpick"){await admAs(b.dataset.e);}
  else if(a==="admexit"){st.ses=null;st.view="";st.nome="";admSet(null);const s=lsGet();if(s&&s.r){try{setSes(await auth("token?grant_type=refresh_token",{refresh_token:s.r}));await start();return;}catch(e){lsSet(null);}}render();}
  else if(a==="novo"){st.novo=true;st.msg=null;st.tab="minhas";render();document.getElementById("novo").scrollIntoView();}
  else if(a==="novono"){st.novo=false;render();}
  else if(a==="novook"){const t=$("#nt").value.trim(),p=$("#np").value.trim(),so=$("#ns").value.trim();if(!t||!p){flash("Preenche pelo menos o título e o problema.",1);return;}
    const id2=Math.random().toString(36).slice(2,14),now=new Date().toISOString(),par=[st.nome,...[...document.querySelectorAll(".npar:checked")].map(c=>c.value)];
    const d={id:id2,titulo:t,problema:p,solucao:so,par,sessao:SESS_NOVA,etapa:"ideacao",gosto:0,aval:{},decisao:"",criadaPor:myEmail(),createdAt:now,updatedAt:now};
    await put("ideias",d);st.ideias.push(d);st.novo=false;st.tab="minhas";flash("Ideia criada. Já podes juntar ficheiros."+sim);}
  else if(a==="open"){const art=b.closest("article"),dt=art.querySelector('details[data-k="'+b.dataset.k+'"]');dt.open=true;dt.scrollIntoView({behavior:"smooth",block:"center"});}
  else if(a==="out"){if(isAdm()){st.ses=null;st.nome="";admSet(null);st.view="admpick";render();return;}try{await fetch(U+"/auth/v1/logout",{method:"POST",headers:hdr()});}catch(e){}st.ses=null;lsSet(null);render();}
  else if(a==="pw"){const u=Object.assign({},st.ses.user);u.user_metadata=Object.assign({},u.user_metadata,{must_change:true});st.ses.user=u;render();}
  else if(a==="sug"){const i=ideia(id),ti=$("#at-"+id),t=ti&&!ti.disabled?ti.value.trim():(i.titulo||""),p=$("#p-"+id).value.trim(),s=$("#s-"+id).value.trim(),n=$("#n-"+id).value.trim();
    if(!t){flash("O título não pode ficar vazio.",1);return;}
    if(t===(i.titulo||"").trim()&&p===(i.problema||"").trim()&&s===(i.solucao||"").trim()){flash("Não alteraste nada.",1);return;}
    await pedido("descricao",i,Object.assign({problema:p,solucao:s,nota:n},t!==(i.titulo||"").trim()?{tituloNovo:t}:{}));st.pan="";flash("Proposta enviada. O coordenador vai ver e responder."+sim);}
  else if(a==="part"){const n=$("#h-"+id).value.trim(),i=ideia(id);if(!n){flash("Explica em poucas palavras como ajudaste.",1);return;}
    await pedido("participar",i,{nota:n});flash("Pedido enviado. Se o coordenador aceitar, passas a fazer parte da ideia."+sim);}
  else if(a==="col"){const n=$("#cj-"+id).value.trim(),i=ideia(id);if(!n){flash("Explica porque queres colaborar e o que podes trazer.",1);return;}
    await pedido("colaborar",i,{nota:n,fase:"c1"});st.pan="";flash("Pedido para colaborar enviado. Se o coordenador aceitar, passas a fazer parte da ideia."+sim);}
  else if(a==="matar"){const n=$("#mj-"+id).value.trim(),i=ideia(id);if(!n){flash("Explica o que mostrou a validação.",1);return;}
    b.disabled=true;const fs=await filesFrom("mk",id,"Validação (pedido para matar)");
    await pedido("matar",i,{nota:n,fase:"c1",ficheiros:fs});st.pan="";flash("Pedido para matar a ideia enviado ao coordenador."+sim);}
  else if(a==="rep"){const n=$("#rj-"+id).value.trim(),i=ideia(id),inp=$("#rk-f-"+id),nOld=document.querySelectorAll(".rk-old:checked").length,nNew=inp&&inp.files?inp.files.length:0;
    if(!n){flash("Escreve a justificação.",1);return;}if(!nOld&&!nNew){flash("Junta pelo menos um ficheiro de validação.",1);return;}
    b.disabled=true;const fs=await filesFrom("rk",id,"Validação (pedido Challenge I)");
    await pedido("repescagem",i,{nota:n,fase:"c1",ficheiros:fs});st.pan="";flash("Pedido para passar ao Challenge I enviado ao coordenador."+sim);}
  else if(a==="fs"){st.fs=Number(b.dataset.v)||0;render();}
  else if(a==="up"){const f=$("#f-"+id).files[0];if(!f){flash("Escolhe primeiro um ficheiro.",1);return;}
    await upload(id,f,$("#t-"+id).value);st.msg="Ficheiro enviado."+(isAdm()?" (modo admin: ficheiro simulado, não foi enviado)":"");st.err=false;render();keep();}
  else if(a==="link"){let u=$("#lu-"+id).value.trim();const nm=$("#ln-"+id).value.trim(),tp=$("#lt-"+id).value;if(!u){flash("Escreve o link.",1);return;}if(!/^https?:\/\//i.test(u))u="https://"+u;
    try{new URL(u);}catch(x){flash("Esse link não parece válido.",1);return;}
    const d={id:nid("m"),email:myEmail(),nome:st.nome,ideiaId:id,ficheiro:nm||u.replace(/^https?:\/\//,"").slice(0,60),url:u,tipo:tp,em:new Date().toISOString()};
    await put("materiais",d);st.mat.push(d);st.msg="Link juntado."+sim;st.err=false;render();keep();}
  else if(a==="dl"){if(String(b.dataset.p).startsWith("simulado/")){flash("Ficheiro simulado no modo admin: não existe no servidor.",1);return;}
    await fresh();const r=await fetch(U+"/storage/v1/object/sign/materiais/"+b.dataset.p,{method:"POST",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify({expiresIn:300})});const j=await r.json();if(!r.ok)throw new Error("Sem acesso ao ficheiro.");window.open(U+"/storage/v1"+j.signedURL,"_blank","noopener");}
  else if(a==="rm"){if(!confirm("Remover este ficheiro?"))return;const m=st.mat.find(x=>x.id===id);
    if(!(m&&(m.simulado||m.url))){if(isAdm()){flash("No modo admin não é possível remover ficheiros reais.",1);return;}await fresh();await fetch(U+"/storage/v1/object/materiais/"+b.dataset.p,{method:"DELETE",headers:hdr()});await rest("docs?col=eq.materiais&id=eq."+encodeURIComponent(id),{method:"DELETE"});}
    if(m&&m.url&&!simulando())await rest("docs?col=eq.materiais&id=eq."+encodeURIComponent(id),{method:"DELETE"});
    st.mat=st.mat.filter(x=>x.id!==id);st.msg="Ficheiro removido.";st.err=false;render();keep();}
  }catch(x){flash(x.message||"Erro.",1);}});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;st.q=e.target.value;filtra();});
document.addEventListener("change",async e=>{
  if(e.target.id==="admsel"){await admAs(e.target.value);}
  else if(e.target.id==="admsim"){st.sim=e.target.checked;render();}});
async function start(){try{await loadAll();}catch(x){st.load=false;st.msg="Não foi possível carregar os dados.";st.err=true;}render();}
(async()=>{
  /* Modo admin: /membro?admin abre logo a escolha de membro; a escolha fica guardada neste separador. */
  const ad=admGet(),wantAdm=/[?&]admin\b/.test(location.search);
  if(ad||wantAdm){const c=codeGet();if(c&&await admEnter(c)){if(ad&&ad.e){await admAs(ad.e);return;}render();return;}if(wantAdm){st.view="admcode";render();return;}}
  const s=lsGet();if(s&&s.r){try{setSes(await auth("token?grant_type=refresh_token",{refresh_token:s.r}));await start();return;}catch(e){lsSet(null);}}render();})();
</script></body></html>
