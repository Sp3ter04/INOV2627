<title>Inovação 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral com os 3 pilares (como o CRM); cada pilar abre em separadores; números primeiro, detalhe depois. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --surface-2:#f7f9fc; --fg:#122033; --muted:#5a6a80; --line:#dbe3ee; --line-2:#c3cfdf;
  --brand:#175dab; --brand-2:#6cc6f0; --brand-soft:#e6f0fb; --on-brand:#ffffff;
  --ok:#1a7f4b; --ok-soft:#e1f3e9; --warn:#946200; --warn-soft:#fbf0d4; --bad:#b4231b; --bad-soft:#fbe7e5; --idle:#eceff4;
  --p-hub:#0c8599; --p-apollo:#3b5bdb; --p-ud:#c2255c; --p-geral:#6b7686;
  --display:"Montserrat",system-ui,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px; --shade:rgb(10 20 40 / .4);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#141d2b; --surface-2:#192435; --fg:#e3eaf4; --muted:#93a3b8; --line:#253246; --line-2:#34445c;
  --brand:#5aa2f0; --brand-2:#7fd0f5; --brand-soft:#1a2c45; --on-brand:#0b1422;
  --ok:#5fd394; --ok-soft:#14301f; --warn:#e8b84e; --warn-soft:#352a10; --bad:#ff8a7e; --bad-soft:#3b1a18; --idle:#212c3c;
  --p-hub:#3bc9db; --p-apollo:#7c97ff; --p-ud:#f06595; --p-geral:#a3adbb; --shade:rgb(0 0 0 / .6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#141d2b; --surface-2:#192435; --fg:#e3eaf4; --muted:#93a3b8; --line:#253246; --line-2:#34445c;
  --brand:#5aa2f0; --brand-2:#7fd0f5; --brand-soft:#1a2c45; --on-brand:#0b1422;
  --ok:#5fd394; --ok-soft:#14301f; --warn:#e8b84e; --warn-soft:#352a10; --bad:#ff8a7e; --bad-soft:#3b1a18; --idle:#212c3c;
  --p-hub:#3bc9db; --p-apollo:#7c97ff; --p-ud:#f06595; --p-geral:#a3adbb; --shade:rgb(0 0 0 / .6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700}
h3{font-size:13.5px;font-weight:700}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.app{background:linear-gradient(90deg,var(--brand) 220px,transparent 220px)}
.side{background:var(--brand);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brandmark{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brandmark b{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.01em}
.brandmark span{font-size:12px;opacity:.8}
.brandmark i{display:block;width:40px;height:3px;background:var(--brand-2);border-radius:2px;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-weight:600;color:rgb(255 255 255 / .82)}
.nav button:hover{background:rgb(255 255 255 / .1);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:#175dab}
.nav button:focus-visible{outline:2px solid var(--brand-2)}
.nav .dot{width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 0 1.5px rgb(255 255 255 / .7)}
.nav .sep{height:1px;background:rgb(255 255 255 / .18);margin:6px 4px}
.side-foot{margin-top:auto;font-size:12px;opacity:.85;padding:0 8px;display:flex;flex-direction:column;gap:6px}
.side-foot .st{display:flex;align-items:center;gap:6px}
.side-foot .st i{width:7px;height:7px;border-radius:50%;background:#ffd166}
.side-foot .st.on i{background:#7be0a5}
.side-foot .st.off i{background:#ff8a7e}

main{padding-block:22px 80px;padding-inline:28px;min-width:0;max-width:1400px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .sub{color:var(--muted);margin-top:3px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 13px;color:var(--muted);font-weight:700;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--brand)}
.tabs .c{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px;font-weight:400}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h .src{font-size:11.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{color:var(--muted);font-size:12.5px}
.tile small{font-size:11.5px;color:var(--muted)}
.tile.hl{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tile.hl span,.tile.hl small{color:var(--on-brand);opacity:.85}
.pillar{border-top:3px solid var(--pc)}
.pillar .card-h h2{display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}

.bar{height:8px;border-radius:4px;background:var(--idle);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hbars{display:flex;flex-direction:column;gap:7px}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:14px;border-radius:3px}
.hbar .v{font-family:var(--mono);text-align:right;font-size:12.5px;white-space:nowrap}
.hbars.mem .hbar{grid-template-columns:minmax(0,150px) minmax(0,1fr) auto}
.hbar .who{display:flex;align-items:center;gap:8px;min-width:0}.hbar .who>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .who .av{flex:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.fstep .fb{background:var(--brand);color:var(--on-brand);font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:4px;min-width:34px;white-space:nowrap}

.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--idle);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.br{background:var(--brand-soft);color:var(--brand)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:3px;color:#fff;background:var(--pc,var(--p-geral));margin-right:5px;vertical-align:1px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--fg)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.x{all:unset;cursor:pointer;color:var(--muted);padding:0 5px;border-radius:4px}
.x:hover{color:var(--bad)} .x:focus-visible{outline:2px solid var(--brand)}
.field{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 8px;min-height:31px;width:100%;min-width:0}
textarea.field{min-height:64px;resize:vertical}
.field.n{width:64px;text-align:center;font-family:var(--mono);padding:4px}
.field.sm{min-height:27px;padding:3px 6px;font-size:13px}
label.l{font-size:12px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:3px;min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .field{width:auto}
.toolbar input[type=search]{flex:1 1 200px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
.empty b{display:block;color:var(--fg);font-family:var(--display);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}
.banner{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner.warn{border-color:var(--warn);background:var(--warn-soft)}

.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;white-space:nowrap}
.tile b.nm{font-family:var(--display);font-size:17px;font-weight:700}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--brand-soft)}
td .t{font-weight:700}
td .s{display:block;color:var(--muted);font-size:12.5px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .ps{display:block;color:var(--muted);font-size:13px;line-height:1.45;max-width:62ch;white-space:normal;margin-top:4px}
td .ps b{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);opacity:.75}
.pcell{display:flex;flex-direction:column;gap:4px;min-width:130px}.pp{display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap}.pp .av{flex:none}
.rowbtn{all:unset;cursor:pointer;display:block}
.rowbtn:focus-visible{outline:2px solid var(--brand)}
.detail td{background:var(--surface-2);padding:12px 14px}

/* ideias */
.sess{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:14px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip:focus-visible{outline:2px solid var(--brand)}
.stars{display:inline-flex;gap:1px}
.stars button{all:unset;cursor:pointer;font-size:15px;line-height:1;color:var(--line-2);padding:0 1px}
.stars button.on{color:#e0a100}
.stars button:focus-visible{outline:2px solid var(--brand)}
.dec{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.dec button{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:3px 8px;color:var(--muted);border-right:1px solid var(--line-2);white-space:nowrap}
.dec button:last-child{border-right:0}
.dec button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.dec button.on.bad{background:var(--bad-soft);color:var(--bad)}
.dec button.on.warn{background:var(--warn-soft);color:var(--warn)}
.dec button.on.ok{background:var(--ok-soft);color:var(--ok)}
.quick{background:var(--surface);border:1px solid var(--brand);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;margin-bottom:14px}
.quick .full{grid-column:1/-1} .quick .h2{grid-column:span 2}
.stage{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:var(--idle);color:var(--muted);white-space:nowrap}
.stage.c1{background:var(--brand-soft);color:var(--brand)} .stage.c2{background:var(--brand);color:var(--on-brand)} .stage.sd{background:var(--warn-soft);color:var(--warn)} .stage.startup{background:var(--ok-soft);color:var(--ok)}
.score{font-family:var(--mono);font-weight:500}
.jhead{writing-mode:horizontal-tb;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.rank{font-family:var(--mono);color:var(--muted);width:28px}

/* startups */
.stepper{display:flex;gap:0;flex-wrap:wrap}
.stepper button{all:unset;cursor:pointer;flex:1 1 110px;font-size:12px;font-weight:700;padding:8px 8px 6px;border-top:4px solid var(--idle);color:var(--muted);text-align:left;line-height:1.25}
.stepper button.done{border-top-color:var(--ok);color:var(--fg)}
.stepper button.cur{border-top-color:var(--brand);color:var(--brand)}
.stepper button:focus-visible{outline:2px solid var(--brand)}
.kpi-row{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,64px) 84px 92px minmax(0,1.2fr) 26px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.kpi-row.h{border-top:0;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:0}
.spark{width:92px;height:26px;display:block}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pstep{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.pstep b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.pstep span{font-size:12px;color:var(--muted)}
.pstep small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.evalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.evc{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;background:var(--surface-2)}
.evc.future{opacity:.75}
.evc-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.jr{display:grid;grid-template-columns:minmax(0,1fr) 60px 22px;gap:6px;align-items:center}

/* timeline */
.tl{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;padding-top:4px}
.tl .m{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;border-left:1px solid var(--line);padding:2px 0 0 4px;letter-spacing:.04em}
.tl-ev{position:relative;height:auto;margin-top:6px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tlist li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline;font-size:13.5px}
.tlist li:first-child{border-top:0}
.tlist .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tlist .d.soon{color:var(--brand);font-weight:500}
.alerts li{grid-template-columns:minmax(0,1fr) auto}

/* MBR */
.mbr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mbr textarea.field{min-height:110px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);border-radius:8px;padding:9px 14px;font-size:13.5px;box-shadow:0 6px 24px rgb(0 0 0 / .25);max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:#fff}
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:20;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:18px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}

@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-row{grid-template-columns:minmax(0,1fr) repeat(3,56px) 70px 26px}.kpi-row .spark,.kpi-row .addv,.kpi-row .hsp,.kpi-row .hadd{display:none}}
@media (max-width:900px){.g2,.g21,.g3,.mbr{grid-template-columns:minmax(0,1fr)}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .side{height:auto;flex-direction:row;align-items:center;padding:8px 16px;gap:12px;overflow-x:auto;z-index:5}
  .brandmark span,.brandmark i,.side-foot{display:none}
  .brandmark b{font-size:14px;white-space:nowrap}
  .nav{flex-direction:row}.nav .sep{display:none}.nav button{white-space:nowrap;padding:6px 9px}
  main{padding-inline:16px;padding-block:16px 60px}
  .form,.quick{grid-template-columns:minmax(0,1fr)}.quick .h2{grid-column:auto}
  .hbar{grid-template-columns:96px minmax(0,1fr) 56px}
  .pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-row{grid-template-columns:minmax(0,1fr) 56px 26px}.kpi-row .mt{display:none}
}
/* Sessão ao vivo / vista do júri */
.livebadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--body);font-size:12px;font-weight:700;opacity:.9;margin-top:4px}
.livebadge i{width:8px;height:8px;border-radius:50%;background:#3ccf7a;box-shadow:0 0 0 3px rgb(60 207 122 / .25);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgb(60 207 122 / 0)}}
.head .livebadge{color:var(--ok);display:flex}
.fbl{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.rowbtn{position:relative;padding-left:22px}.rowbtn .chev{position:absolute;left:2px;top:2px;color:var(--muted);font-size:14px}
.fbul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fbul li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:13.5px;align-items:baseline}
.fbc{display:block;color:var(--fg);margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.jtabs{display:flex;gap:4px;background:rgb(255 255 255 / .14);border-radius:22px;padding:3px;align-self:flex-start;flex-wrap:wrap}
.jtabs button{all:unset;cursor:pointer;padding:6px 14px;border-radius:18px;font-weight:800;font-size:13px;color:#fff}
.jtabs button[aria-pressed="true"]{background:#fff;color:#175dab}
.jtabs button:focus-visible{outline:2px solid #9fdcf7}
.rk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rkrow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:34px auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}

/* ================= Base de dados ================= */
const saveQ=new Map();
function save(col,id){
  if(!S.db){toast("Sem ligação à base de dados: a alteração não foi guardada.",true);return;}
  const key=col+"/"+id;const st=saveQ.get(key)||{t:null,busy:false,again:false};saveQ.set(key,st);
  clearTimeout(st.t);st.t=setTimeout(()=>flush(col,id),350);}
async function flush(col,id){
  const key=col+"/"+id,st=saveQ.get(key);st.t=null;if(st.busy){st.again=true;return;}
  const obj=col==="config"?S.cfg:col==="crm"?S.kpi.get(id):S[col].get(id);if(!obj)return;
  st.busy=true;
  try{const o=clone(obj);o.updatedAt=new Date().toISOString();await S.db.collection(col).doc(id).set(o);emitChange(col,id,o);}
  catch(e){toast("Não foi possível guardar ("+(e&&e.code||"erro")+").",true);}
  st.busy=false;st.done=Date.now();if(st.again){st.again=false;flush(col,id);}}
/* Uma alteração local fica protegida só enquanto está por gravar (e 1,5 s depois), para não bloquear as alterações vindas de outros dispositivos */
const pend=st=>!!st&&(st.busy||!!st.t||Date.now()-(st.done||0)<1500);
/* Tempo real: aviso instantâneo pela sala + verificação a cada 4 s */
const LIVE_COLS=["live","ideias","feedback","sessoes"];
const ROOM_COLS=["ideias","sessoes","feedback","live","startups","contactos","mbr"];
function emitChange(col,id,obj){
  if(!S.room||!ROOM_COLS.includes(col))return;
  const d={col,id};if(obj){const t=JSON.stringify(obj);if(t.length<3500)d.doc=obj;}else d.del=true;
  try{S.room.emit("chg",d).catch(()=>{});}catch(e){}
}
function applyRemote(msg){
  if(!msg||(msg.isMe&&msg.sameTab))return;const d=msg.data||{};const col=d.col;
  if(!ROOM_COLS.includes(col)||typeof d.id!=="string")return;
  const st=saveQ.get(col+"/"+d.id);if(pend(st))return;
  if(d.del)S[col].delete(d.id);
  else if(d.doc&&typeof d.doc==="object"&&!Array.isArray(d.doc))S[col].set(d.id,Object.assign({},d.doc,{id:d.id}));
  else{refresh(col);return;}
  S.lastSync=Date.now();softRender();
}
const refreshing={};
async function refresh(col){
  if(!S.db||refreshing[col])return;refreshing[col]=true;
  try{const snap=await S.db.collection(col).get();const m=new Map();
    snap.docs.forEach(x=>{const v=x.data();if(v)m.set(x.id,Object.assign({id:x.id},clone(v)));});
    for(const [k,st] of saveQ)if(k.startsWith(col+"/")&&pend(st)){const id=k.slice(col.length+1);const cur=S[col].get(id);if(cur)m.set(id,cur);}
    S.lastSync=Date.now();
    if(JSON.stringify([...m])!==JSON.stringify([...S[col]])){S[col]=m;softRender();}else updBadge();
  }catch(e){}
  refreshing[col]=false;
}
function updBadge(){const t=new Date(S.lastSync).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit",second:"2-digit"});document.querySelectorAll(".livebadge").forEach(b=>{b.lastChild.textContent="Ao vivo · atualizado às "+t;});}
async function remove(col,id){S[col].delete(id);render();try{await S.db.collection(col).doc(id).delete();emitChange(col,id,null);}catch(e){toast("Não foi possível apagar.",true);}}
function listen(col){
  S.db.collection(col).onSnapshot(snap=>{
    const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(v)m.set(d.id,Object.assign({id:d.id},clone(v)));});
    for(const [k,st] of saveQ)if(k.startsWith(col+"/")&&pend(st)){const id=k.slice(col.length+1);const cur=S[col].get(id);if(cur)m.set(id,cur);}
    S[col]=m;S.lastSync=Date.now();softRender();},e=>console.warn(col,e&&e.code));}
async function boot(){
  try{const u=window.claude?await window.claude.use("user"):null;if(u){const me=await u.me();S.isOwner=!!me.isOwner;S.me={email:me.email||"",name:me.name||"",id:me.id||""};if(!S.me.id&&typeof u.id==="function"){try{S.me.id=String(await u.id()||"");}catch(e){}}if(typeof u.canEdit==="function"){try{S.canEdit=!!(await u.canEdit());}catch(e){}}if(typeof u.can==="function"){try{const w=await u.can("data.write");S.readOnly=w===false;}catch(e){}}}}catch(e){}S.userKnown=true;
  let db=null;try{db=window.claude?await window.claude.use("db"):null;}catch(e){}
  if(!db){setDb("off");render();return;}
  S.db=db;setDb("on");
  db.collection("config").doc("main").onSnapshot(s=>{
    const v=s.exists?s.data():null;
    if(v){S.cfg=Object.assign(clone(DEFAULT_CFG),v);if(!Array.isArray(S.cfg.hubAcesso))S.cfg.hubAcesso=DEFAULT_CFG.hubAcesso.slice();S.cfg.fases=Object.assign(clone(DEFAULT_CFG.fases),v.fases||{});S.cfg.metas=Object.assign(clone(DEFAULT_CFG.metas),v.metas||{});}
    S.cfgLoaded=true;softRender();},()=>setDb("off"));
  db.collection("crm").doc("snapshot").onSnapshot(s=>{S.crm=s.exists?s.data():null;setCrm();softRender();});
  if(S.isOwner)db.collection("crm").onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{if(d.id.startsWith("kpi_")){const v=d.data();if(v)m.set(d.id,Object.assign({id:d.id},clone(v)));}});
    for(const [k,st] of saveQ)if(k.startsWith("crm/kpi_")&&pend(st)){const id=k.slice(4);const cur=S.kpi.get(id);if(cur)m.set(id,cur);}
    S.kpi=m;softRender();},()=>{});
  ["ideias","sessoes","feedback","live","fotos","startups","contactos","mbr"].concat(S.isOwner?["pedidos"]:[]).forEach(listen);
  softRender();
  try{const sm=await window.claude.use("sample");if(sm){S.sample=sm;softRender();}}catch(e){}
  try{const rm=await window.claude.use("room");if(rm){S.room=rm;rm.on("chg",applyRemote,()=>{});}}catch(e){}
  setInterval(()=>{if(document.hidden||!S.db)return;LIVE_COLS.forEach(refresh);},4000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.db)LIVE_COLS.forEach(refresh);});
}
function setDb(s){S.dbState=s;const el=document.getElementById("st-db");el.className="st "+s;el.querySelector("span").textContent=s==="on"?"Dados guardados na base de dados":s==="off"?"Sem base de dados (só leitura)":"A ligar…";}
function setCrm(){const el=document.getElementById("st-crm");const t=S.crm&&S.crm.syncedAt;el.textContent=t?"CRM lido a "+new Date(t).toLocaleString("pt-PT",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"CRM: ainda sem leitura";}
function saveCfg(){save("config","main");}

/* ================= Render ================= */
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest("#main")&&a.tagName==="SELECT";}
let rq=0;
function softRender(){if(editing()){S.pendingRender=true;return;}if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render();});}
/* Mantém o que está a ser escrito quando chegam alterações de outras pessoas */
const KEY_ATTRS=["id","data-b","data-cfg","data-cfglist","data-pair"];
function fieldKey(el){
  for(const a of KEY_ATTRS)if(el.getAttribute(a))return [a,el.getAttribute(a)];
  if(el.dataset.fb)return ["fb",el.dataset.fb+"|"+el.dataset.k];
  const f=el.form;if(f&&f.dataset.form&&el.name)return ["form",f.dataset.form+"|"+(f.dataset.id||f.dataset.n||f.dataset.f||f.dataset.a||"")+"|"+el.name];
  return null;}
function findField(root,[a,v]){
  return [...root.querySelectorAll("input,textarea,select")].find(el=>{const k=fieldKey(el);return k&&k[0]===a&&k[1]===v;});}
function captureFields(root){
  const act=document.activeElement;const out=[];
  root.querySelectorAll("input,textarea").forEach(el=>{if(el.type==="checkbox"||el.type==="radio"||el.readOnly)return;
    const focused=el===act;const inForm=!!(el.form&&(el.form.dataset.form||el.form.id));
    if(!focused&&!(inForm&&el.value))return;const k=fieldKey(el);if(!k)return;
    out.push({k,v:el.value,focused,s:focused?el.selectionStart:null,e:focused?el.selectionEnd:null});});
  return out;}
function restoreFields(root,list){
  for(const it of list){const el=findField(root,it.k);if(!el)continue;
    if(el.value!==it.v)el.value=it.v;
    if(it.focused){el.focus({preventScroll:true});try{if(it.s!=null)el.setSelectionRange(it.s,it.e);}catch(e){}}}}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pendingRender&&!editing()){S.pendingRender=false;render();}},0));

const VIEWS=[{id:"geral",l:"Visão geral",c:"#fff"},{sep:1},{id:"hub",l:"Bootcamp",c:"var(--p-hub)"},{id:"apollo",l:"Apollo",c:"var(--p-apollo)"},{id:"ud",l:"Unicorn Day",c:"var(--p-ud)"},{id:"kpis",l:"KPIs dos membros",c:"var(--ok)"},{sep:1},{id:"mbr",l:"MBR mensal",c:"var(--brand-2)"},{id:"defs",l:"Definições",c:"transparent"}];
function renderNav(){document.getElementById("nav").innerHTML=VIEWS.filter(v=>S.isOwner||v.id==="hub").map(v=>v.sep?'<div class="sep"></div>':`<button type="button" data-go="${v.id}" ${S.view===v.id?'aria-current="page"':""}><span class="dot" style="background:${v.c}"></span>${v.l}</button>`).join("");}
function render(){
  renderNav();
  const m=document.getElementById("main");const y=window.scrollY;
  const hub=canHub();
  if(!S.isOwner&&hub&&S.view!=="hub"){S.view="hub";}
  document.getElementById("st-crm").hidden=!S.isOwner;
  const jm=S.mode==="juri"||!hub;
  document.querySelector(".app").classList.toggle("jmode",jm);
  if(jm&&!S.userKnown){m.innerHTML=empty("A abrir a sessão de ideação","Um momento.");return;}
  if(window.INOV_GATE&&S.userKnown&&S.mode!=="juri"&&!S.isOwner){document.querySelector(".app").classList.add("jmode");m.innerHTML=window.INOV_GATE();return;}
  const keep=captureFields(m);
  if(jm)m.innerHTML=vJuri();
  else{const fn={geral:vGeral,hub:vHub,apollo:vApollo,ud:vUD,mbr:vMBR,defs:vDefs,kpis:vKPIs}[S.view]||vGeral;m.innerHTML=fn();}
  restoreFields(m,keep);
  window.scrollTo(0,y);
}
function tabs(group,list){return `<div class="tabs" role="tablist">${list.map(([id,l,c])=>`<button type="button" role="tab" data-tab="${group}:${id}" aria-selected="${S.tab[group]===id}">${l}${c!=null?`<span class="c">${c}</span>`:""}</button>`).join("")}</div>`;}
function tile(v,l,sub,cls){return `<div class="tile ${cls||""}">${l?`<span>${l}</span>`:""}${String(v).startsWith('<b')?v:`<b>${v}</b>`}${sub?`<small>${sub}</small>`:""}</div>`;}
function decBtns(opts,cur,act,id,extra){return `<span class="dec" role="group">${opts.map(([k,l,t])=>`<button type="button" class="${cur===k?"on "+t:""}" aria-pressed="${cur===k}" data-act="${act}" data-id="${id}" data-v="${k}" ${extra||""}>${l}</button>`).join("")}</span>`;}
function progress(cur,goal,color){if(!goal)return "";const p=Math.min(100,Math.round(cur/goal*100));return `<div class="bar" title="${p}%"><i style="width:${p}%;background:${color||"var(--brand)"}"></i></div>`;}
function empty(t,s){return `<div class="empty"><b>${t}</b>${s||""}</div>`;}

/* ---------- Cálculos ---------- */
function partStats(filter){
  const ps=crm().parcerias.filter(filter);
  const conf=ps.filter(p=>p.estado==="confirmado"||p.estado==="pago");
  const pipe=ps.filter(p=>!["confirmado","pago","sem interesse"].includes(p.estado));
  return{ps,conf,pipe,eurConf:conf.reduce((s,p)=>s+(p.valor||0),0),eurPipe:pipe.reduce((s,p)=>s+(p.valor||0),0),
    byEstado:Object.fromEntries(P_EST.map(e=>[e,ps.filter(p=>p.estado===e).length]))};}
const isApollo=p=>p.pilar==="Apollo"||p.pilar==="UD + Apollo";
const isUD=p=>p.pilar==="Unicorn Day"||p.pilar==="UD + Apollo";
function startupMoney(st){
  const din=(st.dinheiro||[]).filter(d=>d.estado==="ganho").reduce((s,d)=>s+Number(d.valor||0),0);
  const vendas=[...S.contactos.values()].filter(c=>c.startupId===st.id&&c.estado==="venda").reduce((s,c)=>s+Number(c.valor||0),0);
  return{din,vendas,total:din+vendas};}
function activeStartups(){return [...S.startups.values()].filter(s=>s.estado!=="terminada").sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));}
function ideaAvg(i,f){const a=i.aval&&i.aval[f];return a?avg(Object.values(a.notas||{})):null;}
function evAvg(st,id){const a=st.aval&&st.aval[id];return a?avg(Object.values(a.notas||{})):null;}
function kpiCur(k){const v=(k.valores||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));return v.length?Number(v[v.length-1].v):null;}
function nextCp(){const t=TODAY();return S.cfg.avals.filter(a=>a.cp).find(a=>a.data>=t)||S.cfg.avals.filter(a=>a.cp).slice(-1)[0];}
function funnel(){const all=[...S.ideias.values()];return ETAPAS.map(e=>[e,all.filter(i=>rank(i.etapa)>=rank(e)).length]);}
function hbar(label,parts,total,max,valTxt){
  return `<div class="hbar"><span>${label}</span><div class="bar">${parts.map(([v,c,t])=>v?`<i style="width:${max?v/max*100:0}%;background:${c}" title="${esc(t||"")}: ${v}"></i>`:"").join("")}</div><span class="v">${valTxt??total}</span></div>`;}

function objectives(){
  const sts=activeStartups(),m=S.cfg.metas,c=crm();
  const inc=sts.filter(s=>s.incubadora).length;

function dupKey(a,b){return [a,b].sort().join("|");}
function dupTok(i){return new Set(norm([i.titulo,i.problema].join(" ")).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3));}
function dupSim(a,b){const A=dupTok(a),B=dupTok(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(w=>{if(B.has(w))n++;});return n/Math.min(A.size,B.size);}
function dupPairs(){
  const all=[...S.ideias.values()],ign=new Set(S.cfg.dupIgnorar||[]),out=new Map();
  const add=(a,b,why)=>{if(!a||!b||a.id===b.id)return;const k=dupKey(a.id,b.id);if(ign.has(k)||out.has(k))return;out.set(k,{a,b,why});};
  all.forEach(i=>{if(i.origem)add(S.ideias.get(i.origem),i,"Retomada de uma sessão anterior");});
  for(let x=0;x<all.length;x++)for(let y=x+1;y<all.length;y++){const a=all[x],b=all[y],ta=norm(a.titulo).trim();
    if(ta&&ta===norm(b.titulo).trim())add(a,b,"Mesmo título");else if(dupSim(a,b)>=0.6)add(a,b,"Título e problema parecidos");}
  return [...out.values()];
}
function dupPlan(x,y){
  const older=((x.sessao||0)-(y.sessao||0))||String(x.createdAt||"").localeCompare(String(y.createdAt||""));
  const [old,keep]=older<=0?[x,y]:[y,x];
  const par=[...new Set([...(keep.par||[]),...(old.par||[])].filter(Boolean))];
  const fb=[...S.feedback.values()].filter(f=>f.ideiaId===old.id).length;
  return {old,keep,par,novos:par.filter(p=>!(keep.par||[]).includes(p)),fb};
}
function dupTxt(k,pl){S.dupTxt=S.dupTxt||{};if(S.dupTxt[k])return S.dupTxt[k];const L=i=>String(i.problema||"").length+String(i.solucao||"").length;return L(pl.keep)>=L(pl.old)?"keep":"old";}
function dupBoth(x,y){x=String(x||"").trim();y=String(y||"").trim();if(!x)return y;if(!y||norm(x).includes(norm(y)))return x;if(norm(y).includes(norm(x)))return y;return x+"\n\n"+y;}

function dupMerge(aId,bId){
  const a=S.ideias.get(aId),b=S.ideias.get(bId);if(!a||!b)return;
  const pl=dupPlan(a,b),{old,keep}=pl,t=dupTxt(dupKey(a.id,b.id),pl);
  if(old.startupId&&keep.startupId){toast("As duas ideias já são startups: junta-as no separador Startups.",true);return;}
  const now=new Date().toISOString();
  keep.juntou=[...(keep.juntou||[]),{id:old.id,titulo:old.titulo||"",sessao:old.sessao,par:old.par||[],problema:old.problema||"",solucao:old.solucao||"",gosto:old.gosto||0,decisao:old.decisao||"",em:now}];
  keep.par=pl.par;
  keep.problema=t==="old"?(old.problema||keep.problema||""):t==="both"?dupBoth(keep.problema,old.problema):(keep.problema||old.problema||"");
  keep.solucao=t==="old"?(old.solucao||keep.solucao||""):t==="both"?dupBoth(keep.solucao,old.solucao):(keep.solucao||old.solucao||"");
  keep.gosto=Math.max(keep.gosto||0,old.gosto||0);if(!keep.decisao&&old.decisao)keep.decisao=old.decisao;
  if(rank(old.etapa)>rank(keep.etapa))keep.etapa=old.etapa;keep.aval=Object.assign({},old.aval||{},keep.aval||{});
  if(old.startupId&&!keep.startupId){keep.startupId=old.startupId;const st=S.startups.get(old.startupId);if(st){st.ideiaId=keep.id;save("startups",st.id);}}
  if(keep.origem===old.id)delete keep.origem;
  for(const f of S.feedback.values())if(f.ideiaId===old.id){f.ideiaId=keep.id;save("feedback",f.id);}
  for(const i of S.ideias.values())if(i.origem===old.id&&i.id!==keep.id){i.origem=keep.id;save("ideias",i.id);}
  save("ideias",keep.id);if(S.dupMan&&[S.dupMan.a,S.dupMan.b].includes(old.id))S.dupMan=null;
  remove("ideias",old.id);toast(`Juntadas em “${keep.titulo||""}” · ${keep.par.length} pessoas.`);
}

function spark(vals){
  const v=(vals||[]).slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>Number(x.v));
  if(v.length<2)return `<svg class="spark" viewBox="0 0 92 26" aria-hidden="true"><line x1="2" y1="22" x2="90" y2="22" stroke="var(--line-2)" stroke-dasharray="2 3"/>${v.length?`<circle cx="90" cy="13" r="2.5" fill="var(--brand)"/>`:""}</svg>`;
  const mx=Math.max(...v),mn=Math.min(0,...v),r=mx-mn||1;
  const pts=v.map((y,k)=>[2+k*(88/(v.length-1)),23-(y-mn)/r*20]);
  const d=pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 92 26" aria-hidden="true"><path d="${d} L90 24 L2 24 Z" fill="var(--brand-soft)"/><path d="${d}" fill="none" stroke="var(--brand)" stroke-width="1.6"/><circle cx="${l[0]}" cy="${l[1]}" r="2.5" fill="var(--brand)"/></svg>`;
}

function shufflePairs(n){
  const M=S.cfg.membros.slice();const past=new Set();
  for(let k=1;k<n;k++)(sess(k).pares||[]).forEach(p=>combos(p).forEach(x=>past.add(x)));
  let best=null,bestRep=1e9;
  for(let t=0;t<400&&bestRep>0;t++){const a=M.slice().sort(()=>Math.random()-.5);const ps=[];for(let k=0;k+1<a.length;k+=2)ps.push({a:a[k],b:a[k+1]});if(a.length%2)ps.push({a:a[a.length-1],b:""});
    const rep=ps.filter(p=>combos(p).some(x=>past.has(x))).length;if(rep<bestRep){bestRep=rep;best=ps;}}
  return best;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="jtab"){S.jTab=v;render();window.scrollTo(0,0);}
  else if(a==="jprev"){S.preview=!S.preview;render();}
  else if(a==="jgo"){S.jTab="avaliar";const k=Number(v);if(k>=0){S.jPar=k;S.follow=k===(liveState().parAtual||0);}render();window.scrollTo(0,0);}
  else if(a==="jpar"){S.jPar=Number(v);S.follow=S.jPar===(liveState().parAtual||0);render();}
  else if(a==="jfollow"){S.follow=true;render();}
  else if(a==="jset"){S.jurado=v;S.draft={};try{localStorage.setItem("inov-jurado",v);}catch(e){}render();}
  else if(a==="jout"){S.jurado="";S.draft={};try{localStorage.removeItem("inov-jurado");}catch(e){}render();}
  else if(a==="tohome"){history.replaceState(null,"",location.pathname+location.search);S.mode="app";S.view="hub";S.tab.hub="live";rememberUI();render();window.scrollTo(0,0);}

  else if(a==="jnow"){setLive({parAtual:S.jPar});S.follow=true;render();}
  else if(a==="verd"){if(!S.jurado)return;const d=draftOf(b.dataset.id);d.veredito=d.veredito===v?"":v;render();}
  else if(a==="pedok"||a==="pedno"){const id=b.dataset.id,p=S.pedidos.get(id);if(!p)return;
    if(a==="pedok"){const key=p.email||norm(p.nome).trim().replace(/\s+/g,".");S.cfg.sessEditores=Object.assign({},S.cfg.sessEditores||{});const l=(S.cfg.sessEditores[String(p.sessao)]||[]).slice();if(!l.includes(key))l.push(key);S.cfg.sessEditores[String(p.sessao)]=l;saveCfg();p.estado="aprovado";save("pedidos",id);toast("Aprovado. Convida a pessoa como Editor no menu Partilhar.");}
    else{remove("pedidos",id);toast("Pedido recusado.");}render();}
  else if(a==="jedit"){S.jEdit=b.dataset.id||null;render();}
  else if(a==="fbsend")sendFb(b.dataset.id,b,"veredito");
  else if(a==="qsend")sendFb(b.dataset.id,b,"pergunta");
  else if(a==="fbdel")delFb(b.dataset.v);
  else if(a==="liven"){S.liveN=Number(v);render();}
  else if(a==="setlive"){setLive({sessao:Number(v),parAtual:0});render();toast(`O link do júri mostra agora a ${v}.ª sessão.`);}
  else if(a==="livenow"){setLive({parAtual:Number(v)});render();}
  else if(a==="addtrio"){const s=editSess(Number(v));s.pares.push({a:"",b:"",c:""});save("sessoes",s.id);render();}
  else if(a==="rmpar"){const n=Number(v),k=Number(b.dataset.k),s=editSess(n),p=s.pares[k];if(!p)return;
    const doIt=()=>{s.pares.splice(k,1);save("sessoes",s.id);const L=liveState(),pa=L.parAtual||0;if(L.sessao===n){if(pa>=s.pares.length)setLive({parAtual:Math.max(0,s.pares.length-1)});else if(pa>k)setLive({parAtual:pa-1});}render();};
    const nm=mem3(p).join(" & ")||"este grupo",ni=(p.a||p.b)?ideasOfPair(n,p).length:0;
    if(mem3(p).length)confirmDlg(`Apagar ${nm}?`,ni?`${ni} ideias deste grupo deixam de aparecer ao júri (continuam na lista de ideias).`:"O grupo sai da sessão.",doIt);else doIt();}
  else if(a==="addpar"){const s=editSess(Number(v));s.pares.push({a:"",b:""});save("sessoes",s.id);render();}
  else if(a==="shuf"){const s=editSess(Number(v));const ps=shufflePairs(Number(v));if(ps){s.pares=ps;save("sessoes",s.id);render();toast("Pares sorteados. Podes ajustar à mão.");}}
  else if(a==="rmjl"){const s=editSess(Number(v));s.juri.splice(Number(b.dataset.k),1);save("sessoes",s.id);render();}
  else if(a==="copylink"){const el=document.getElementById("jlink");const done=()=>toast("Link copiado.");try{navigator.clipboard.writeText(el.value).then(done,()=>{el.select();toast("Seleciona e copia o link.");});}catch(err){el.select();}}
});

  const og=reusePick();if(og&&S.ideias.get(og)){const o=S.ideias.get(id);o.origem=og;if(S.ideias.get(og).tipo)o.tipo=S.ideias.get(og).tipo;}
  S.reuse=null;save("ideias",id);render();toast("Ideia visível para o júri.");
});

/* ================= Ações ================= */
function getPath(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[decodeURIComponent(k)],o);}
function setPath(o,p,v){const ks=p.split(".").map(decodeURIComponent);let a=o;for(let k=0;k<ks.length-1;k++){const nx=/^\d+$/.test(ks[k+1]);if(a[ks[k]]==null||typeof a[ks[k]]!=="object")a[ks[k]]=nx?[]:{};a=a[ks[k]];}
  if(v===""&&!Array.isArray(a)&&ks[ks.length-2]!=="notas")delete a[ks[ks.length-1]];else a[ks[ks.length-1]]=v;}
function conv(el){const t=el.dataset.type;if(t==="bool")return el.checked;const v=el.value;if(t==="num")return v===""?"":Number(v);return v;}
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.b&&el.type!=="checkbox"&&el.tagName!=="SELECT"){bindSet(el,false);}

document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.b)bindSet(el,true);
  else if(el.dataset.cfg){setPath(S.cfg,el.dataset.cfg,el.type==="number"?(el.value===""?"":Number(el.value)):el.value);saveCfg();S.pendingRender=true;}
  else if(el.dataset.sesab){const k=Number(el.dataset.sesab);const a=(S.cfg.sessAbertas||[]).map(Number).filter(x=>x!==k);if(el.checked)a.push(k);S.cfg.sessAbertas=a.sort();saveCfg();}
  else if(el.dataset.sesed){S.cfg.sessEditores=Object.assign({},S.cfg.sessEditores||{});S.cfg.sessEditores[el.dataset.sesed]=el.value.split("\n").map(x=>x.trim().toLowerCase()).filter(Boolean);saveCfg();}
  else if(el.dataset.cfglist){S.cfg[el.dataset.cfglist]=el.value.split("\n").map(s=>s.trim()).filter(Boolean);saveCfg();}
  else if(el.dataset.act==="toc1"){const i=S.ideias.get(el.dataset.id);i.etapa=el.checked?"c1":"ideacao";save("ideias",i.id);render();}
  else if(el.id==="f-dec"){S.f.dec=el.value;render();}
  else if(el.id==="f-par"){S.f.par=el.value;render();}
  else if(el.id==="f-tipo"){S.f.tipo=el.value;render();}
  else if(el.id==="reuse"){const f=el.form,o=S.ideias.get(el.value);S.reuse=el.value?{k:S.jPar,id:el.value}:null;
    if(f){for(const k of ["titulo","problema","solucao"]){const x=f.elements[k];if(x)x.value=o?(o[k]||""):"";}const t=f.elements.titulo;if(t&&o)t.focus();}}
  else if(el.id==="f-ord"){S.f.ord=el.value;rememberUI();render();}
  else if(el.id==="mbr-mes"){S.mes=el.value;render();}
  else if(el.id==="q-sess"){S.quick.sessao=Number(el.value);rememberUI();}
  else if(el.id==="q-a")S.quick.a=el.value; else if(el.id==="q-b")S.quick.b=el.value;
});
function bindSet(el,rerender){
  const [col,id,path]=el.dataset.b.split("|");
  let obj=S[col].get(id);if(!obj){if(col!=="mbr")return;obj={id};S[col].set(id,obj);}
  let v=conv(el);
  if(path==="membrosTxt"){obj.membros=String(v).split(",").map(s=>s.trim()).filter(Boolean);}
  setPath(obj,path,v);save(col,id);
  if(rerender&&(el.tagName==="SELECT"||el.type==="checkbox"))render();else if(rerender)S.pendingRender=true;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-go],[data-tab],[data-open],[data-act],[data-fsess],[data-st]");if(!b)return;
  if(b.tagName==="INPUT")return;
  if(b.dataset.go){S.view=b.dataset.go;S.open=null;rememberUI();render();window.scrollTo(0,0);return;}
  if(b.dataset.tab){const [g,t]=b.dataset.tab.split(":");S.tab[g]=t;S.open=null;rememberUI();render();return;}
  if(b.dataset.open){S.open=S.open===b.dataset.open?null:b.dataset.open;render();return;}
  if(b.dataset.fsess!=null){S.f.sess=Number(b.dataset.fsess);render();return;}
  if(b.dataset.st&&!b.dataset.act){S.view="hub";S.tab.hub="startups";S.stSel=b.dataset.st;rememberUI();render();return;}
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="gosto"){const i=S.ideias.get(id);const v=Number(b.dataset.v);i.gosto=i.gosto===v?0:v;save("ideias",id);render();}
  else if(a==="idec"){const i=S.ideias.get(id);i.decisao=i.decisao===b.dataset.v?"":b.dataset.v;save("ideias",id);render();}
  else if(a==="fdec")setFaseDec(id,b.dataset.f,b.dataset.v);
  else if(a==="dupman"){const x=document.getElementById("dup-a").value,y=document.getElementById("dup-b").value;if(!x||!y||x===y){toast("Escolhe duas ideias diferentes.",true);return;}S.dupMan={a:x,b:y};render();}
  else if(a==="dupclear"){S.dupMan=null;render();}
  else if(a==="duptxt"){S.dupTxt=S.dupTxt||{};S.dupTxt[b.dataset.k]=b.dataset.v;render();}
  else if(a==="dupno"){const L=S.cfg.dupIgnorar=Array.isArray(S.cfg.dupIgnorar)?S.cfg.dupIgnorar:[];if(!L.includes(b.dataset.k))L.push(b.dataset.k);save("config","main");render();toast("Par marcado como ideias diferentes.");}
  else if(a==="dupok"){const x=S.ideias.get(b.dataset.a),y=S.ideias.get(b.dataset.b);if(!x||!y)return;const pl=dupPlan(x,y);confirmDlg("Juntar estas duas ideias?",`Fica “${pl.keep.titulo||""}” (${pl.keep.sessao}.ª sessão) com ${pl.par.length} pessoas e mais ${pl.fb} feedback(s). “${pl.old.titulo||""}” (${pl.old.sessao}.ª sessão) deixa de aparecer em separado; fica registada dentro da ideia que fica.`,()=>dupMerge(x.id,y.id),"Juntar");}
  else if(a==="delidea"){const it=S.ideias.get(id);confirmDlg("Apagar esta ideia?",`“${it&&it.titulo||""}” e as notas dos júris desaparecem. Não dá para desfazer.`,()=>{S.open=null;if(S.jEdit===id)S.jEdit=null;
    if(S.isOwner)for(const f of [...S.feedback.values()])if(f.ideiaId===id)remove("feedback",f.id);remove("ideias",id);toast("Ideia apagada.");});}
  else if(a==="impjuri"){const f=b.dataset.f;const ev=crmEventFor(f);const J=S.cfg.fases[f].juri=S.cfg.fases[f].juri||[];let n=0;(ev.juri||[]).filter(j=>j.estado==="confirmado").forEach(j=>{if(!J.includes(j.nome)){J.push(j.nome);n++;}});saveCfg();render();toast(n?`${n} jurados importados.`:"Já estavam todos.");}
  else if(a==="rmjuri"){S.cfg.fases[b.dataset.f].juri.splice(Number(b.dataset.k),1);saveCfg();render();}
  else if(a==="proto"){const s=S.startups.get(id);const v=Number(b.dataset.v);s.prototipo=s.prototipo||{nivel:0,log:[]};if(s.prototipo.nivel!==v){s.prototipo.nivel=v;(s.prototipo.log=s.prototipo.log||[]).push({d:TODAY(),nivel:v});save("startups",id);render();}}
  else if(a==="addkpi"){const s=S.startups.get(id);(s.kpis=s.kpis||[]).push({id:uid(),nome:"Novo KPI",metas:{},valores:[]});save("startups",id);render();}
  else if(a==="rmkpi"){const s=S.startups.get(id);confirmDlg("Remover este KPI?","Perdes também o histórico de valores.",()=>{s.kpis.splice(Number(b.dataset.k),1);save("startups",id);render();});}
  else if(a==="adddin"){const s=S.startups.get(id);(s.dinheiro=s.dinheiro||[]).push({id:uid(),d:TODAY(),origem:"",tipo:"grant",estado:"candidatura",valor:""});save("startups",id);render();}
  else if(a==="rmdin"){const s=S.startups.get(id);s.dinheiro.splice(Number(b.dataset.k),1);save("startups",id);render();}
  else if(a==="rmct")remove("contactos",id);
  else if(a==="cpdec"){const s=S.startups.get(id);const cur=getPath(s,`aval.${b.dataset.a}.decisao`);setPath(s,`aval.${b.dataset.a}.decisao`,cur===b.dataset.v?"":b.dataset.v);save("startups",id);render();}
  else if(a==="rmevj"){const s=S.startups.get(id);delete s.aval[b.dataset.a].notas[b.dataset.n];save("startups",id);render();}
  else if(a==="newst"){const st=newStartup({titulo:"Nova startup"});S.stSel=st.id;render();}
  else if(a==="delst")confirmDlg("Apagar esta startup?","Os KPIs, avaliações e dinheiro registados desaparecem. Os contactos ficam órfãos.",()=>{const s=S.startups.get(id);if(s&&s.ideiaId){const i=S.ideias.get(s.ideiaId);if(i){i.startupId="";save("ideias",i.id);}}S.stSel=null;remove("startups",id);});
  else if(a==="mbrai")mbrAI();
});
function newStartup(i){
  const id=uid();const st={id,nome:i.titulo,ideiaId:i.id||"",gestor:"",membros:[],membrosTxt:"",mentor:"",estado:"ativa",descricao:i.problema||"",site:"",deck:"",incubadora:false,
    prototipo:{nivel:0,log:[{d:TODAY(),nivel:0}]},kpis:S.cfg.kpisModelo.map(n=>({id:uid(),nome:n,metas:{},valores:[]})),aval:{},dinheiro:[],createdAt:new Date().toISOString()};
  S.startups.set(id,st);save("startups",id);return st;}
function setFaseDec(id,f,v){
  const i=S.ideias.get(id);i.aval=i.aval||{};i.aval[f]=i.aval[f]||{};
  const cur=i.aval[f].decisao;const nv=cur===v?"":v;i.aval[f].decisao=nv;
  const nx=NEXT[f];
  if(nv==="avanca"||nv==="startup"){if(rank(i.etapa)<rank(nx))i.etapa=nx;}
  else if(rank(i.etapa)>rank(f)&&!(f==="sd"&&i.startupId&&nv==="")){i.etapa=f;}
  if(nv==="startup"&&!i.startupId){const st=newStartup(i);i.startupId=st.id;toast(`“${i.titulo}” é agora uma startup. Abre o separador Startups.`);}
  save("ideias",id);render();}
function confirmDlg(t,s,ok,lbl){
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="overlay"><div class="dlg" role="dialog" aria-modal="true"><h2>${esc(t)}</h2><p class="note" style="margin:0">${esc(s)}</p><div class="row end"><button class="btn" id="dlg-no">Cancelar</button><button class="btn ${lbl?"pri":"danger"}" id="dlg-ok">${esc(lbl||"Apagar")}</button></div></div></div>`;
  document.getElementById("dlg-no").onclick=()=>m.innerHTML="";document.getElementById("dlg-ok").onclick=()=>{m.innerHTML="";ok();};document.getElementById("dlg-no").focus();}

render();boot();
</script>
